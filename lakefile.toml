name = "math153"
defaultTargets = ["Examples"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Examples"
# Build every module under Examples/. Without this, Lake looks for a root file
# Examples.lean, which does not exist, and plain `lake build` fails with
# "some modules have bad imports".
globs = ["Examples.+"]
