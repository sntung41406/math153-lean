<h1 id="proofs-with-structure">Proofs with Structure</h1>
<h2 id="math-153--introduction-to-mathematics">MATH 153 — Introduction to Mathematics</h2>
<p>Week 3 · Fall 2026</p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>

<h2 id="the-question-for-today">The question for today</h2>
<blockquote>
<p>What should a proof do when one calculation is not enough?</p>
</blockquote>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="3" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="learning-goals">Learning goals</h2>
<p>By the end of the lecture, you can:</p>
<ul>
<li>Prove and reuse an intermediate fact with <code>have</code>.</li>
<li>Use a known lemma with <code>apply</code>, and prove the goal it leaves behind.</li>
<li>Read the proof shape of <code>or</code>, <code>and</code>, and &quot;there exists&quot; — both as hypotheses and as goals.</li>
<li>Recognise when a cancellation step needs a side condition.</li>
</ul>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="4" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="a-proof-can-have-structure">A proof can have structure</h2>
<blockquote>
<p>A structured proof breaks a complex statement into smaller deductions, names the useful ones, and completes every resulting subgoal.</p>
</blockquote>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">hypotheses → named fact → calculation → goal
                 ↘ another subgoal ↗
</code></pre>
<p><strong>A proof communicates its reasoning to a reader. It is not a record of your scratch work.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="5" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="26" data-size="16:9">

<p><strong>In Lean</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {a b : ℝ} (h1 : a - 5 * b = 4)
    (h2 : b + 2 = 3) : a = 9 := by
  have hb : b = 1 := by linarith
  calc
    a = a - 5 * b + 5 * b := by ring
    _ = 4 + 5 * 1         := by rw [h1, hb]
    _ = 9                 := by ring
</code></pre>
</div>
</div>
<ul>
<li><code>:= by linarith</code> <strong>proves</strong> the newly named fact from <code>h2</code>.</li>
<li>Once that proof closes, <code>hb : b = 1</code> joins the facts Lean can use.</li>
</ul>

<h2 id="apply-in-lean"><code>apply</code> in Lean</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {x : ℚ} (hx : 3 * x = 2) : x ≠ 1 := by
  apply ne_of_lt
  calc
    x = 3 * x / 3 := by ring
    _ = 2 / 3     := by rw [hx]
    _ &lt; 1         := by norm_num
</code></pre>
<p><code>ne_of_lt : a &lt; b → a ≠ b</code>. The goal changes:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ x ≠ 1        after apply ne_of_lt        ⊢ x &lt; 1
</code></pre>
<p class="small"><code>⊢</code> means <em>current goal</em>: what Lean is still asking you to prove. Anything listed above it is what you already know.</p>
<p><strong>Backward reasoning: &quot;it suffices to show <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="5.442ex" height="1.597ex" role="img" focusable="false" viewBox="0 -666 2405.6 706"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mo" transform="translate(849.8,0)"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z"></path></g><g data-mml-node="mn" transform="translate(1905.6,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container>.&quot;</strong> The rest is a familiar <code>calc</code> chain.</p>

<h2 id="or-has-two-proof-shapes">&quot;Or&quot; has two proof shapes</h2>
<div class="cols">
<div>
<p><strong>If you have <code>P ∨ Q</code></strong></p>
<ul>
<li>Consider the <code>P</code> case and the <code>Q</code> case.</li>
<li>Both cases must reach the same goal.</li>
</ul>
</div>
<div>
<p><strong>If your goal is <code>P ∨ Q</code></strong></p>
<ul>
<li>Choose one side that you can prove.</li>
<li>Prove only the chosen alternative.</li>
</ul>
</div>
</div>
<p class="small"><strong>Shape to move:</strong> hypothesis <code>P ∨ Q</code> → split cases; goal <code>P ∨ Q</code> → choose a side.</p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>

<h2 id="the-lean-case-split">The Lean case split</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">  obtain hx | hy := h
  · calc  -- first branch, using hx : x = 1
  · calc  -- second branch, using hy : y = -1
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">h : P ∨ Q         after obtain hp | hq := h     hp : P        hq : Q
⊢ R                                             ⊢ R           ⊢ R
</code></pre>
<p>Each focusing dot <code>·</code> begins one branch. <strong>Both branches must be finished.</strong></p>

<p><strong>Which alternative is actually true?</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {x : ℝ} (hx : 2 * x + 1 = 5) : x = 1 ∨ x = 2 := by
  right
  calc
    x = (2 * x + 1 - 1) / 2 := by ring
    _ = (5 - 1) / 2         := by rw [hx]
    _ = 2                   := by norm_num
</code></pre>
<p><strong>The decision is <code>right</code>; after that it is a familiar calculation.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="and-also-has-two-proof-shapes">&quot;And&quot; also has two proof shapes</h2>
<div class="cols">
<div>
<p><strong>If you have <code>P ∧ Q</code></strong></p>
<ul>
<li>Unpack it into the two facts <code>P</code> and <code>Q</code>.</li>
<li>One hypothesis containing two facts.</li>
</ul>
</div>
<div>
<p><strong>If your goal is <code>P ∧ Q</code></strong></p>
<ul>
<li>Prove <code>P</code>, then prove <code>Q</code>.</li>
<li>One goal with two required parts.</li>
</ul>
</div>
</div>
<p>An <code>or</code> hypothesis creates <strong>cases</strong>; an <code>and</code> hypothesis simply <strong>supplies both facts</strong>.</p>
<p class="small"><strong>Shape to move:</strong> hypothesis <code>P ∧ Q</code> → unpack two facts; goal <code>P ∧ Q</code> → prove two goals.</p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="17" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="unpack-an-and-hypothesis">Unpack an &quot;and&quot; hypothesis</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {x y : ℤ} (h : 2 * x - y = 4 ∧ y - x + 1 = 2) : x = 5 := by
  obtain ⟨h1, h2⟩ := h
  calc
    x = 2 * x - y + (y - x + 1) - 1 := by ring
    _ = 4 + 2 - 1                   := by rw [h1, h2]
    _ = 5                           := by ring
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">h : P ∧ Q         after obtain ⟨hp, hq⟩ := h     hp : P
⊢ R                                              hq : Q
                                                 ⊢ R
</code></pre>
<p><strong>This changes the available facts, not the number of goals.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="build-an-and-goal">Build an &quot;and&quot; goal</h2>
<p>The same <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="3.173ex" height="2.009ex" role="img" focusable="false" viewBox="0 -694 1402.7 888"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g><g data-mml-node="mo" transform="translate(529,0)"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z"></path></g><g data-mml-node="mi" transform="translate(973.7,0)"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g></g></g></svg></mjx-container> problem as before — new goal shape:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {a b : ℝ} (h1 : a - 5 * b = 4) (h2 : b + 2 = 3) :
    a = 9 ∧ b = 1 := by
  have hb : b = 1 := by linarith
  constructor
  · calc
      a = a - 5 * b + 5 * b := by ring
      _ = 4 + 5 * 1         := by rw [h1, hb]
      _ = 9                 := by ring
  · linarith
</code></pre>
<p><strong><code>constructor</code> makes two goals. Both parts must close.</strong></p>

<h2 id="use-turns-the-existence-goal-concrete"><code>use</code> turns the existence goal concrete</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example (x : ℝ) : ∃ y : ℝ, y &gt; x := by
  use x + 1
  linarith
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ ∃ y : ℝ, y &gt; x        after use x + 1          ⊢ x + 1 &gt; x
</code></pre>
<p><strong>Finding the witness is the mathematical idea; checking it is usually routine.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="26" data-size="16:9">
<h2 id="use-an-existential-hypothesis">Use an existential hypothesis</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">  obtain ⟨b, hb⟩ := h
</code></pre>
<p>If <code>h : ∃ b : ℚ, a = b ^ 2 + 1</code>, this gives you two things:</p>
<ul>
<li>a particular but unspecified number <code>b</code>;</li>
<li>its defining property <code>hb : a = b ^ 2 + 1</code>.</li>
</ul>
<p>The rest of the proof uses both as ordinary facts.</p>
<p><strong>Same angle brackets as <code>and</code> — a witness packaged with its property.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="the-structured-proof-checklist">The structured-proof checklist</h2>
<ol>
<li>Read the hypothesis and goal <strong>shapes</strong> before choosing a tactic.</li>
<li>Name an intermediate fact only when the rest of the proof will use it.</li>
<li>When applying a lemma, prove every hypothesis it requires.</li>
<li>When a proof branches, finish <strong>every</strong> branch.</li>
<li>Keep using a <code>calc</code> chain whenever the remaining subgoal is a calculation.</li>
</ol>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="exit-check">Exit check</h2>
<ol>
<li>You need a fact now, and again later in the proof. Which command begins that step?</li>
<li>Your goal matches a lemma's conclusion. After <code>apply</code>, what must you prove?</li>
<li>Your hypothesis is <code>∃ x, P x</code>. What two things do you obtain?</li>
</ol>
