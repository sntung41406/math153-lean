<h2 id="read-the-outside-first">Read the outside first</h2>
<p>From Week 3:</p>
<ul>
<li>Goal <code>∃</code> → supply a witness.</li>
<li>Goal <code>∧</code> → prove both parts.</li>
<li>Hypothesis <code>∨</code> → handle both cases.</li>
</ul>
<p><strong>Who chooses the number in &quot;for every real number&quot;? Who chooses it in &quot;there exists a real number&quot;?</strong></p>
<p>Today's habit: <strong>find the outermost structure, make its move, then read the new goal.</strong></p>
<p class="small">The same statement plays a different role as a hypothesis than as a goal.</p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="3" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="28" data-size="16:9">
<h2 id="learning-goals">Learning goals</h2>
<p>By the end of the lecture, you can:</p>
<ul>
<li>Prove a &quot;for all&quot; or &quot;if … then&quot; statement, and use one by supplying the inputs it asks for.</li>
<li>Read nested quantifiers and choose witnesses with the right dependencies.</li>
<li>Prove both directions of an &quot;if and only if&quot; and use the direction you need.</li>
<li>Separate existence from uniqueness and use a uniqueness condition.</li>
<li>Identify which contradiction argument fits the current goal.</li>
</ul>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="intro-receives-an-arbitrary-value"><code>intro</code> receives an arbitrary value</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : ∃ b : ℝ, ∀ x : ℝ, b ≤ x ^ 2 - 2 * x := by
  use -1
  intro x
  nlinarith [sq_nonneg (x - 1)]
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">after use -1       ⊢ ∀ x : ℝ, -1 ≤ x ^ 2 - 2 * x
after intro x      x : ℝ
                   ⊢ -1 ≤ x ^ 2 - 2 * x
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {a : ℝ} (h : ∀ x, a ≤ x ^ 2 - 2 * x) : a ≤ -1 :=
  calc
    a ≤ 1 ^ 2 - 2 * 1 := by apply h
    _ = -1              := by norm_num
</code></pre>
<p><code>apply h</code> fills in the value this step needs. Writing <code>h 1</code> supplies the same value by hand.</p>

<p>Two opposite inequalities give equality. This principle is called <strong>antisymmetry</strong>.</p>
<p><strong>Hypothesis <code>∀ y, P y → Q y</code> → supply a value <code>y</code> and a proof of <code>P y</code>.</strong></p>

<h2 id="the-lean-proof-supplies-both-inputs">The Lean proof supplies both inputs</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {a b : ℝ} (ha1 : a ^ 2 ≤ 2) (hb1 : b ^ 2 ≤ 2)
    (ha2 : ∀ y, y ^ 2 ≤ 2 → y ≤ a) (hb2 : ∀ y, y ^ 2 ≤ 2 → y ≤ b) :
    a = b := by
  have h1 : a ≤ b := hb2 a ha1
  have h2 : b ≤ a := ha2 b hb1
  exact le_antisymm h1 h2
</code></pre>
<table>
<thead>
<tr>
<th>Lean</th>
<th>What it does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>hb2 a ha1</code></td>
<td>gives <code>hb2</code> the value <code>a</code> and the proof <code>ha1 : a ^ 2 ≤ 2</code></td>
</tr>
<tr>
<td><code>hb2 a</code> alone</td>
<td>is only the implication <code>a ^ 2 ≤ 2 → a ≤ b</code></td>
</tr>
<tr>
<td><code>le_antisymm h1 h2</code></td>
<td>from <code>a ≤ b</code> and <code>b ≤ a</code>, proves <code>a = b</code></td>
</tr>
</tbody>
</table>
<p class="small"><code>exact</code> closes the goal with that proof. With <code>apply</code> instead: <em>Module 4 - Conditional universal hypothesis example</em>.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">after constructor      ⊢ 3 * a + 1 ≤ 7 → a ≤ 2      ⊢ a ≤ 2 → 3 * a + 1 ≤ 7
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {a : ℚ} : 3 * a + 1 ≤ 7 ↔ a ≤ 2 := by
  constructor
  · intro h
    calc a = ((3 * a + 1) - 1) / 3 := by ring
      _ ≤ (7 - 1) / 3            := by linarith
      _ = 2                      := by norm_num
  · intro h
    linarith
</code></pre>
<p><code>constructor</code> is familiar from <code>∧</code>. Here it makes one goal per direction. The second branch is slide 7.</p>
<p><strong>Goal <code>P ↔ Q</code> → prove <code>P → Q</code> and <code>Q → P</code>.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="guided-activity-which-direction-do-we-need">Guided activity: which direction do we need?</h2>
<p>Let <code>hiff : 3 * a + 1 ≤ 7 ↔ a ≤ 2</code>, with <code>a : ℚ</code>.</p>
<ul>
<li><code>hiff.mp</code> goes from <strong>left to right</strong>.</li>
<li><code>hiff.mpr</code> goes from <strong>right to left</strong>.</li>
</ul>
<table>
<thead>
<tr>
<th>Available fact</th>
<th>Goal</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>h : 3 * a + 1 ≤ 7</code></td>
<td><code>a ≤ 2</code></td>
<td></td>
</tr>
<tr>
<td><code>h : a ≤ 2</code></td>
<td><code>3 * a + 1 ≤ 7</code></td>
<td></td>
</tr>
</tbody>
</table>
<p><strong>One minute: fill in the last column, and say in a sentence why.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="reveal-select-a-direction-or-rewrite">Reveal: select a direction, or rewrite</h2>
<table>
<thead>
<tr>
<th>Available fact</th>
<th>Goal</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>h : 3 * a + 1 ≤ 7</code></td>
<td><code>a ≤ 2</code></td>
<td><code>hiff.mp h</code></td>
</tr>
<tr>
<td><code>h : a ≤ 2</code></td>
<td><code>3 * a + 1 ≤ 7</code></td>
<td><code>hiff.mpr h</code></td>
</tr>
</tbody>
</table>
<p class="small">Uses of the given equivalence <code>hiff</code> — expressions, not complete proofs.</p>
<p><code>rw [hiff]</code> replaces the <strong>left</strong> side by the <strong>right</strong> side, like an equation:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ 3 * a + 1 ≤ 7        after rw [hiff]        ⊢ a ≤ 2
</code></pre>
<p>To go back from <code>a ≤ 2</code> to <code>3 * a + 1 ≤ 7</code>, write <code>rw [← hiff]</code>, as in Week 2.</p>
<p class="small">With a named theorem: <em>Module 4 - Using an iff example</em>. Both directions of 8 ∣ 5n ↔ 8 ∣ n: <em>Module 4 - Divisibility iff example</em>.</p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="16" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="28" data-size="16:9">
<h2 id="exactly-one-has-two-requirements">&quot;Exactly one&quot; has two requirements</h2>
<table>
<thead>
<tr>
<th>Claim</th>
<th>What must be shown</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>At least one</strong> solution</td>
<td>Give a witness with the property.</td>
</tr>
<tr>
<td><strong>At most one</strong> solution</td>
<td>Any two candidates with the property are equal.</td>
</tr>
<tr>
<td><strong>Exactly one</strong> solution, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.887ex" height="1.62ex" role="img" focusable="false" viewBox="0 -716 834 716"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="2203" d="M56 661T56 674T70 694H487Q497 686 500 679V15Q497 10 487 1L279 0H70Q56 7 56 20T70 40H460V327H84Q70 334 70 347T84 367H460V654H70Q56 661 56 674Z"></path></g><g data-mml-node="mo" transform="translate(556,0)"><path data-c="21" d="M78 661Q78 682 96 699T138 716T180 700T199 661Q199 654 179 432T158 206Q156 198 139 198Q121 198 119 206Q118 209 98 431T78 661ZM79 61Q79 89 97 105T141 121Q164 119 181 104T198 61Q198 31 181 16T139 1Q114 1 97 16T79 61Z"></path></g></g></g></svg></mjx-container></td>
<td>Give a witness with the property, and show every candidate equals it.</td>
</tr>
</tbody>
</table>
<p><strong>Why does proving &quot;at most one&quot; leave open that there is no solution at all?</strong></p>
<p><strong>A witness alone does not prove uniqueness.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<p><strong>Existence.</strong> Take <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="5.345ex" height="1.692ex" role="img" focusable="false" viewBox="0 -666 2362.6 748"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g><g data-mml-node="mo" transform="translate(806.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(1862.6,0)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></svg></mjx-container>: indeed <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="11.942ex" height="1.715ex" role="img" focusable="false" viewBox="0 -676 5278.4 758"><g stroke="currentColo <h2 id="unique-existence-reuses-earlier-proof-shapes">Unique existence reuses earlier proof shapes</h2>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : ∃! a : ℝ, 3 * a + 1 = 7 := by
  use 2
  dsimp
  constructor
  · norm_num
  intro y hy
  calc
    y = (3 * y + 1 - 1) / 3 := by ring
    _ = (7 - 1) / 3 := by rw [hy]
    _ = 2 := by norm_num
</code></pre>
</div>
<div>
<p>After <code>use 2</code> and <code>dsimp</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ 3 * 2 + 1 = 7
  ∧ ∀ y : ℝ, 3 * y + 1 = 7 → y = 2
</code></pre>
<ul>
<li><code>dsimp</code> tidies the goal so both requirements are readable.</li>
<li><code>constructor</code> splits the <code>∧</code>.</li>
<li><code>intro y hy</code> gives a candidate <code>y</code> and its property <code>hy</code>.</li>
</ul>
</div>
</div>
<p><strong>Goal <code>∃! a, P a</code> → witness, property, uniqueness.</strong></p>

<h2 id="contradiction-first-identify-the-goal">Contradiction: first identify the goal</h2>
<p><code>False</code> is the statement that is never true. Reaching it means something is impossible.</p>
<table>
<thead>
<tr>
<th>Situation</th>
<th>What the proof does</th>
</tr>
</thead>
<tbody>
<tr>
<td>The hypotheses already disagree</td>
<td>Derive an impossibility; any goal follows.</td>
</tr>
<tr>
<td>The goal is <code>¬ P</code></td>
<td>Assume <code>P</code>, then prove <code>False</code>.</td>
</tr>
<tr>
<td>The goal is <code>P</code>, by contradiction</td>
<td>Assume <code>¬ P</code>, then prove <code>False</code>.</td>
</tr>
</tbody>
</table>
<p><strong>In the last two rows, which statement do we assume?</strong></p>
<p><code>¬ P</code> means <code>P → False</code>. <span class="small">Why the third row is a valid method: Module 5.</span></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {t : ℤ} (h2 : t &lt; 3) (h : t - 1 = 6) : t = 13 := by
  have H : (7:ℤ) &lt; 3 := by
    have ht : t = 7 := by linarith
    rw [ht] at h2
    exact h2
  norm_num at H
</code></pre>
<p>New: <code>rw [ht] at h2</code> rewrites inside the hypothesis <code>h2</code>, not in the goal. <code>norm_num at H</code> checks the numbers in <code>H</code>; <code>H</code> is false, so the goal closes.</p>
<p><strong>This proves an &quot;if … then&quot; with impossible assumptions.</strong> No integer satisfies both.</p>
<p class="small">Another way to finish, with the <code>contradiction</code> tactic: <em>Module 4 - Contradictory hypotheses example</em>.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {x y : ℝ} (hsum : x + y = 0) : ¬(x &gt; 0 ∧ y &gt; 0) := by
  intro h
  obtain ⟨hx, hy⟩ := h
  have H : (0:ℝ) &gt; 0 := by
    calc (0:ℝ) = x + y := by rw [hsum]
    _ &gt; 0 := by linarith
  linarith
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ ¬(x &gt; 0 ∧ y &gt; 0)        after intro h        h : x &gt; 0 ∧ y &gt; 0
                                               ⊢ False
</code></pre>
<p><strong>Goal <code>¬ P</code> → <code>intro h</code>. Now <code>h : P</code> and the goal is <code>False</code>.</strong></p>

<h2 id="by_contra-assumes-the-goal-is-false"><code>by_contra</code> assumes the goal is false</h2>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {y : ℝ} (x : ℝ)
    (h : 0 &lt; x * y) (hx : 0 ≤ x) :
    0 &lt; y := by
  by_contra hy
  have hy' : y ≤ 0 := not_lt.mp hy
  have H : x * y ≤ 0 := by
    calc
      x * y ≤ x * 0 := by gcongr
      _ = 0 := by ring
  linarith
</code></pre>
</div>
<div>
<ul>
<li><code>by_contra hy</code> adds <code>hy : ¬(0 &lt; y)</code>. The goal becomes <code>False</code>.</li>
<li><code>not_lt.mp hy</code> turns <code>hy</code> into <code>y ≤ 0</code>: an <code>↔</code> used left to right.</li>
<li><code>gcongr</code> compares matching parts. It needs <code>0 ≤ x</code>.</li>
</ul>
</div>
</div>
<p><strong>Positive goal <code>P</code>, by contradiction → <code>by_contra h</code> assumes <code>¬ P</code>.</strong></p>
<p class="small">Use a direct proof when one is clear. The same proof as a case split: <em>Module 4 - Ruling out a case example</em>.</p>

<h2 id="read-move-check-what-remains">Read, move, check what remains</h2>
<div class="compact">
<table>
<thead>
<tr>
<th>Shape or situation</th>
<th>Proof move</th>
</tr>
</thead>
<tbody>
<tr>
<td>Goal <code>∀ x, P x</code> or <code>P → Q</code></td>
<td>Introduce a value, or assume the condition.</td>
</tr>
<tr>
<td>Hypothesis <code>∀ x, P x → Q x</code></td>
<td>Supply a value and its condition.</td>
</tr>
<tr>
<td>Nested <code>∃</code> and <code>∀</code></td>
<td>Choose witnesses in order.</td>
</tr>
<tr>
<td>Goal or hypothesis <code>P ↔ Q</code></td>
<td>Prove both directions, or use the one you need.</td>
</tr>
<tr>
<td>Goal or hypothesis <code>∃! x, P x</code></td>
<td>Build or extract witness, property, uniqueness.</td>
</tr>
<tr>
<td>Hypotheses already disagree</td>
<td>Derive an impossibility.</td>
</tr>
<tr>
<td>Goal <code>¬ P</code></td>
<td>Assume <code>P</code>; prove <code>False</code>.</td>
</tr>
<tr>
<td>Positive goal <code>P</code>, by contradiction</td>
<td>Assume <code>¬ P</code>; prove <code>False</code>.</td>
</tr>
</tbody>
</table>
</div>
<p><strong>Finish every required direction, property, and branch.</strong></p>

<h2 id="exit-check">Exit check</h2>
<p>Write a proof <strong>plan</strong> for each, not a full script.</p>
<ol>
<li>Prove <code>∃! a : ℝ, 3 * a + 1 = 7</code>. Give a witness, and explain how the uniqueness part starts and finishes. For a candidate <code>y</code> you may use <code>hiff : 3 * y + 1 = 7 ↔ y = 2</code>; name the direction you need.</li>
<li>Refute <code>∀ x : ℝ, x ^ 2 ≥ x</code>. State what you assume and a useful input. Then compare: what does <code>by_contra</code> assume when the goal is <code>0 &lt; y</code>?</li>
</ol>
