<h2 id="the-question-for-today">The question for today</h2>
<blockquote>
<p>What concrete evidence proves that a number is odd, divisible by another number, or congruent to another number?</p>
</blockquote>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="3" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="28" data-size="16:9">
<h2 id="learning-goals">Learning goals</h2>
<p>By the end of the lecture, you can:</p>
<ul>
<li>State parity, divisibility, and congruence as witness statements, and produce a witness for a simple claim.</li>
<li>Use an existing parity or divisibility witness to construct a new one.</li>
<li>Explain why congruences can be added and substituted into a polynomial, and check all residues modulo 3.</li>
<li>Use a Bézout equation to justify cancelling a coprime factor.</li>
</ul>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {n : ℤ} (hn : Odd n) : Odd (3 * n + 2) := by
  obtain ⟨k, hk⟩ := hn
  use 3 * k + 2
  calc
    3 * n + 2 = 3 * (2 * k + 1) + 2 := by rw [hk]
    _ = 2 * (3 * k + 2) + 1          := by ring
</code></pre>
<p><strong><code>obtain</code> takes evidence out of a hypothesis; <code>use</code> puts evidence into the goal.</strong> <code>calc</code> checks the chosen witness.</p>

<h2 id="parity-cases-in-lean">Parity cases in Lean</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">obtain hn | hn := Int.even_or_odd n
· obtain ⟨x, hx⟩ := hn
  use 2 * x ^ 2 + x + 2
  -- substitute hx and check the algebra
· obtain ⟨x, hx⟩ := hn
  use 2 * x ^ 2 + 3 * x + 3
  -- substitute hx and check the algebra
</code></pre>

<h2 id="the-same-transformation-in-lean">The same transformation in Lean</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {a b : ℤ} (hab : a ∣ b) : a ∣ b ^ 2 + 2 * b := by
  obtain ⟨k, hk⟩ := hab
  use k * (a * k + 2)
  calc
    b ^ 2 + 2 * b = (a * k) ^ 2 + 2 * (a * k) := by rw [hk]
    _ = a * (k * (a * k + 2))                  := by ring
</code></pre>
<p><strong>Find:</strong> where <code>k</code> comes from, the new witness, and the two checks.</p>
<p class="small">Proving that something does <em>not</em> divide, like 5 ∤ 12, is for practice: <em>Module 3 - Non-divisibility example</em>.</p>

<h2 id="leans-difference-has-the-opposite-order">Lean's difference has the opposite order</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : (11 : ℤ) ≡ 3 [ZMOD 4] := by
  rw [Int.modEq_iff_dvd]
  use -2
  norm_num
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ 11 ≡ 3 [ZMOD 4]   →   ⊢ 4 ∣ 3 - 11   →   ⊢ 3 - 11 = 4 * -2
</code></pre>
<p class="small"><code>⊢</code> marks the current goal, as in Week 3: what Lean still asks you to prove.</p>
<p><code>Int.modEq_iff_dvd</code> turns the congruence into divisibility of <code>3 - 11</code>.</p>
<p><strong>Why would <code>use 2</code> fail?</strong></p>

<h2 id="the-lean-analogue-rel-substitutes-a-congruence">The Lean analogue: <code>rel</code> substitutes a congruence</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {a b : ℤ} (ha : a ≡ 4 [ZMOD 5]) (hb : b ≡ 3 [ZMOD 5]) :
    a * b + b ^ 3 + 3 ≡ 2 [ZMOD 5] :=
  calc
    a * b + b ^ 3 + 3 ≡ 4 * b + b ^ 3 + 3 [ZMOD 5] := by rel [ha]
    _ ≡ 4 * 3 + 3 ^ 3 + 3 [ZMOD 5]                  := by rel [hb]
    _ = 2 + 5 * 8                                     := by norm_num
    _ ≡ 2 [ZMOD 5]                                    := by decide
</code></pre>
<table>
<thead>
<tr>
<th>Tool</th>
<th>What it does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>rel [ha]</code></td>
<td>substitutes a <strong>congruence</strong> inside the expression</td>
</tr>
<tr>
<td><code>rw [h]</code></td>
<td>substitutes an <strong>equality</strong></td>
</tr>
<tr>
<td><code>decide</code></td>
<td>checks the final numeric congruence</td>
</tr>
</tbody>
</table>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">mod_cases hx : x % 3

<h2 id="the-number-theory-proof-checklist">The number-theory proof checklist</h2>
<table>
<thead>
<tr>
<th>Statement shape</th>
<th>First move</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Odd n</code>, <code>Even n</code>, or <code>a ∣ b</code> as a hypothesis</td>
<td>extract the witness with <code>obtain</code></td>
</tr>
<tr>
<td>The same shapes as a goal</td>
<td>find the equation, then <code>use</code> its witness</td>
</tr>
<tr>
<td><code>a ≡ b [ZMOD n]</code></td>
<td>substitute with <code>rel</code>, or convert to divisibility and check the order</td>
</tr>
<tr>
<td>A claim about every integer</td>
<td>split into parity or residue cases</td>
</tr>
<tr>
<td>Cancelling a factor in divisibility</td>
<td>check coprimality; use Bézout to build a witness</td>
</tr>
</tbody>
</table>
<p><strong>The proof is complete when the equation is checked and every case is closed.</strong></p>
