<h2 id="learning-goals">Learning goals</h2>
<p><strong>What would count as evidence that a mathematical statement is false?</strong></p>
<p>By the end of the lecture, you can:</p>
<ul>
<li>Read the five connectives and use a truth table to test a logical equivalence.</li>
<li>Distinguish an implication, its converse, and its contrapositive.</li>
<li>Read quantified statements in order and say which inputs a witness may depend on.</li>
<li>Explain a <code>by_cases</code> split using excluded middle.</li>
<li>Negate a statement by hand, predict <code>push Not</code>, and describe the evidence for a disproof.</li>
</ul>
<p class="small">Familiar moves: <code>intro</code>, <code>use</code>, <code>constructor</code>, <code>obtain</code>. New today: <code>by_cases</code> and <code>push Not</code>.</p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="3" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="27" data-size="16:9">
<h2 id="five-connectives-one-meaning-each">Five connectives, one meaning each</h2>
<table>
<thead>
<tr>
<th>Connective</th>
<th>Read as</th>
<th>True exactly when</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>P ∧ Q</code></td>
<td>P and Q</td>
<td>both are true</td>
</tr>
<tr>
<td><code>P ∨ Q</code></td>
<td>P or Q</td>
<td><strong>at least one</strong> is true</td>
</tr>
<tr>
<td><code>¬ P</code></td>
<td>not P</td>
<td><code>P</code> is false</td>
</tr>
<tr>
<td><code>P → Q</code></td>
<td>P implies Q</td>
<td><code>P</code> is false, or <code>Q</code> is true</td>
</tr>
<tr>
<td><code>P ↔ Q</code></td>
<td>P if and only if Q</td>
<td>both have the same truth value</td>
</tr>
</tbody>
</table>
<p>In Lean, <code>P Q : Prop</code> says <code>P</code> and <code>Q</code> are <strong>propositions</strong>: statements we can try to prove.</p>
<p><strong>Goal <code>∧</code> → prove both parts. Goal <code>∨</code> → choose one side.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="4" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="27" data-size="16:9">

<h2 id="reveal-same-truth-values-logically-equivalent">Reveal: same truth values, logically equivalent</h2>
<table>

<p>Two statements are <strong>logically equivalent</strong> when they agree in every row — whatever <code>P</code> and <code>Q</code> say.</p>
<p>A <strong>tautology</strong> is true in every row, such as <code>P ∨ ¬ P</code>. A <strong>contradiction</strong> is false in every row, such as <code>P ∧ ¬ P</code>.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example (P : Prop) : (P ∨ P) ↔ P := by
  constructor
  · intro h
    obtain h1 | h2 := h
    · exact h1
    · exact h2
  · intro h
    left
    exact h
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {α : Type*} {P Q : α → Prop}
    (h1 : ∀ x : α, P x)
    (h2 : ∀ x : α, Q x) :
    ∀ x : α, P x ∧ Q x := by
  intro x
  constructor
  · exact h1 x
  · exact h2 x
</code></pre>

<p><code>α</code> is the domain; <code>P Q : α → Prop</code> are predicates on it.</p>
<p><strong>Why would one convenient particular <code>x</code> not prove this goal?</strong></p>

<p><strong>In Lean</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {P : Prop} (h : ¬¬P) : P := by
  by_cases hP : P
  · exact hP
  · contradiction
</code></pre>
</div>
</div>
<p><code>¬ P</code> means <code>P → False</code>. Assuming <code>¬ P</code> and reaching a contradiction proves <code>¬¬ P</code>. Excluded middle gives the last step to <code>P</code>.</p>
<p>This is why Module 4's <code>by_contra</code> works for a <strong>positive</strong> goal.</p>
<p><strong>Split on whether <code>P</code> holds → <code>by_cases hP : P</code>.</strong></p>

<h2 id="negation-changes-what-evidence-we-need">Negation changes what evidence we need</h2>
<div class="compact">
<table>
<thead>
<tr>
<th>Statement</th>
<th>Its negation</th>
<th>Evidence for the negation</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>P ∧ Q</code></td>
<td><code>¬ P ∨ ¬ Q</code></td>
<td>one part fails</td>
</tr>
<tr>
<td><code>P ∨ Q</code></td>
<td><code>¬ P ∧ ¬ Q</code></td>
<td>both parts fail</td>
</tr>
<tr>
<td><code>P → Q</code></td>
<td><code>P ∧ ¬ Q</code></td>
<td>premise holds, conclusion fails</td>
</tr>
<tr>
<td><code>¬ P</code></td>
<td><code>P</code></td>
<td><code>P</code> itself</td>
</tr>
<tr>
<td><code>∀ x ∈ A, P x</code></td>
<td><code>∃ x ∈ A, ¬ P x</code></td>
<td>one failing input</td>
</tr>
<tr>
<td><code>∃ x ∈ A, P x</code></td>
<td><code>∀ x ∈ A, ¬ P x</code></td>
<td>every candidate ruled out</td>
</tr>
</tbody>
</table>
</div>

<h2 id="predict-push-not-before-running-it">Predict <code>push Not</code> before running it</h2>
<p><code>push Not</code> applies the negation rules and flips negated comparisons. It changes the statement; it does not usually finish the proof.</p>
<p><strong>Predict the new goal:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ ¬∀ (x : ℝ), x ^ 2 ≥ x        after push Not        ⊢ ∃ x, x ^ 2 &lt; x
</code></pre>
<p class="small">Lean omits types it can infer: <code>x</code> still ranges over <code>ℝ</code>.</p>
<p>By default, <code>push Not</code> turns <code>¬ (P ∧ Q)</code> into <code>P → ¬ Q</code>. Write <code>push +distrib Not</code> for <code>¬ P ∨ ¬ Q</code>.</p>
<p class="small">Older sources call this tactic <code>push_neg</code>; this course writes <code>push Not</code>.</p>

<p>In Module 4 we assumed the universal claim and used it at <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.781ex;" xmlns="http://www.w3.org/2000/svg" width="1.795ex" height="2.737ex" role="img" focusable="false" viewBox="0 -864.9 793.6 1209.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mstyle"><g data-mml-node="mfrac"><g data-mml-node="mn" transform="translate(220,394) scale(0.707)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mn" transform="translate(220,-345) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g><rect width="553.6" height="60" x="120" y="220"></rect></g></g></g></g></svg></mjx-container>. Now the counterexample is an ordinary <strong>witness</strong>.</p>
<p><strong>Why would <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="5.442ex" height="1.692ex" role="img" focusable="false" viewBox="0 -666 2405.6 748"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mo" transform="translate(849.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(1905.6,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></svg></mjx-container> not work?</strong></p>

<h2 id="disprove-there-exists-by-ruling-out-every-candidate">Disprove &quot;there exists&quot; by ruling out every candidate</h2>
<div class="cols">
<div>
<p><strong>On paper</strong></p>
<p>Disprove: some real <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.98ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 433 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g></g></g></svg></mjx-container> is larger than every real <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.971ex" height="1.595ex" role="img" focusable="false" viewBox="0 -694 429 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g></g></g></svg></mjx-container>.</p>
<p>For each proposed <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.98ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 433 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g></g></g></svg></mjx-container>, take <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="4.967ex" height="1.756ex" role="img" focusable="false" viewBox="0 -694 2195.6 776"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g><g data-mml-node="mo" transform="translate(706.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mi" transform="translate(1762.6,0)"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g></g></g></svg></mjx-container>. Then <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="4.967ex" height="1.661ex" role="img" focusable="false" viewBox="0 -694 2195.6 734"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g><g data-mml-node="mo" transform="translate(706.8,0)"><path data-c="3C" d="M694 -11T694 -19T688 -33T678 -40Q671 -40 524 29T234 166L90 235Q83 240 83 250Q83 261 91 266Q664 540 678 540Q681 540 687 534T694 519T687 505Q686 504 417 376L151 250L417 124Q686 -4 687 -5Q694 -11 694 -19Z"></path></g><g data-mml-node="mi" transform="translate(1762.6,0)"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g></g></g></svg></mjx-container> fails.</p>
<p><strong>Why is checking just <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="5.128ex" height="1.692ex" role="img" focusable="false" viewBox="0 -666 2266.6 748"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g><g data-mml-node="mo" transform="translate(710.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(1766.6,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></svg></mjx-container> not enough?</strong></p>
</div>
<div>
<p><strong>In Lean</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">after push Not
⊢ ∀ (c : ℝ), ∃ b, c ≤ b
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : ¬ ∃ c : ℝ,
    ∀ b : ℝ, b &lt; c := by
  push Not
  intro c
  use c
</code></pre>
</div>
</div>
<p><code>intro c</code>: an arbitrary candidate. <code>use c</code>: its defeating input, which also closes <code>c ≤ c</code>.</p>
<p><strong>Every candidate must be ruled out; its defeating input may depend on it.</strong></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : ¬ (∀ a b c : ℕ,
    a ∣ b * c → a ∣ b ∨ a ∣ c) := by
  push Not
  use 4, 2, 2
  decide
</code></pre>
<p><code>decide</code> checks the statements about these specific numbers. The real work was choosing them.</p>

</div>
<p><strong>4 and 2 are not coprime, so Module 3's cancellation rule does not apply.</strong> <span class="small"><em>Module 3 - Coprime cancellation example</em></span></p>
<p><strong>Disproof is a proof of the negation, with every remaining obligation checked.</strong></p>

<h2 id="structure-determines-evidence">Structure determines evidence</h2>
<div class="compact">
<table>
<thead>
<tr>
<th>Structure</th>
<th>As a goal</th>
<th>As a hypothesis</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>P ∧ Q</code></td>
<td>Prove both: <code>constructor</code></td>
<td>Extract both: <code>obtain</code></td>
</tr>
<tr>
<td><code>P ∨ Q</code></td>
<td>Choose: <code>left</code> or <code>right</code></td>
<td>Handle both cases: <code>obtain</code></td>
</tr>
<tr>
<td><code>P → Q</code></td>
<td>Assume <code>P</code>: <code>intro</code></td>
<td>Supply a proof of <code>P</code></td>
</tr>
<tr>
<td><code>P ↔ Q</code></td>
<td>Both directions: <code>constructor</code></td>
<td>Select a direction: <code>.mp</code> / <code>.mpr</code></td>
</tr>
<tr>
<td><code>∀ x, P x</code></td>
<td>Arbitrary input: <code>intro</code></td>
<td>Supply an input</td>
</tr>
<tr>
<td><code>∃ x, P x</code></td>
<td>Choose a witness: <code>use</code></td>
<td>Extract witness and property: <code>obtain</code></td>
</tr>
</tbody>
</table>
</div>
<p><strong>Cases on <code>P</code> → <code>by_cases</code>. Inconsistent hypotheses → <code>contradiction</code>. Negation → predict, then <code>push Not</code>.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
