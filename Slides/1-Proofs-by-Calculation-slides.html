<h2 id="the-question-for-today">The question for today</h2>
<blockquote>
<p>How can a familiar calculation become a proof that another person, and Lean, can check?</p>
</blockquote>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>

<h2 id="learning-goals">Learning goals</h2>
<p>By the end of the lecture, you can:</p>
<ul>
<li>Read and write a <code>calc</code> chain whose lines follow from the line above.</li>
<li>Read a known equality in either direction, then use <code>rw</code> to make a matching rewrite.</li>
<li>Use <code>norm_num</code> for a numerical fact and <code>ring</code> to check a planned rearrangement.</li>
<li>Use an order rule as an inequality step in a <code>calc</code> chain.</li>
</ul>

<p><strong>In Lean</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {total : ℤ} (h : total = 12) :
    total - 4 = 8 := by
  calc
    total - 4 = 12 - 4 := by rw [h]
    _         = 8      := by norm_num
</code></pre>
</div>
</div>
<ul>
<li><code>calc</code> opens the chain.</li>
<li><code>rw [h]</code> performs the substitution.</li>
<li><code>norm_num</code> verifies the remaining numeric fact.</li>
</ul>

<h2 id="the-underscore-_-and-the-next-proof-state">The underscore <code>_</code> and the next proof state</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">    _ = 8 := by norm_num
</code></pre>
<p><strong>What does <code>_</code> stand for on this line?</strong></p>
<p><code>_</code> stands for the previous right-hand side, here <code>12 - 4</code>.</p>
<p>Each line is its own small goal:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">total - 4 = 12 - 4
12 - 4 = 8
</code></pre>
<p>We present one honest step at a time, with a reason for that step.</p>

</section>

<h2 id="ring-checks-the-rearrangement"><code>ring</code> checks the rearrangement</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {x : ℤ} (h : x + 4 = 2) : x = -2 := by
  calc
    x = (x + 4) - 4 := by ring
    _ = 2 - 4       := by rw [h]
    _ = -2          := by norm_num
</code></pre>
<p><strong>You choose <code>(x + 4) - 4</code>; <code>ring</code> checks that choice.</strong></p>

<h2 id="forward-and-reverse-rw">Forward and reverse <code>rw</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {x y z : ℤ} (h1 : y = x + 1) (h2 : z = x + 1) : y = z := by
  calc
    y = x + 1 := by rw [h1]
    _ = z     := by rw [← h2]
</code></pre>
<p><code>← h2</code> means “read <code>h2</code> from right to left”: replace <code>x + 1</code> with <code>z</code>.</p>
<p>Here, forward <code>rw [h2]</code> also closes the step. The reverse form makes the paper chain literal.</p>
<p>When a goal contains <code>x + 1</code> but not <code>z</code>, only <code>rw [← h2]</code> can act.</p>
<p class="small">Typing ← in VS Code: <code>\l</code> then Tab.</p>

<h2 id="guided-proof-in-lean">Guided proof in Lean</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {r s : ℤ} (h1 : r + 2 * s = -1) (h2 : s = 3) : r = -7 := by
  calc
    r = (r + 2 * s) - 2 * s := by ring
    _ = -1 - 2 * s          := by rw [h1]
    _ = -1 - 2 * 3          := by rw [h2]
    _ = -7                  := by norm_num
</code></pre>
<p><strong>You choose <code>(r + 2 * s) - 2 * s</code>; <code>ring</code> checks that choice.</strong></p>

<h2 id="an-order-preserving-lean-step">An order-preserving Lean step</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {x : ℤ} (h : x ≤ 2) : x + 3 ≤ 5 := by
  calc
    x + 3 ≤ 2 + 3 := add_le_add_left h 3
    _     = 5     := by norm_num
</code></pre>

<h2 id="the-calculation-proof-checklist">The calculation-proof checklist</h2>
<ol>
<li>Start at the left side of the goal and decide where the chain should end.</li>
<li>Find a next expression justified by a fact, an algebraic identity, a calculation, or an order rule.</li>
<li>Check that every equality or inequality points in the direction required by the chain.</li>
<li>In Lean, give the corresponding proof method for each line.</li>
</ol>
