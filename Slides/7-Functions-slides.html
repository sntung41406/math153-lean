<h2 id="read-the-arrow-before-starting-the-proof">Read the arrow before starting the proof</h2>
<p>By the end of the lecture, you can:</p>
<ul>
<li>Prove injectivity or surjectivity, or give a collision or a missed output.</li>
<li>Compose two functions and prove that they agree at every input.</li>
<li>Use the two inverse identities to explain why a function is bijective.</li>
<li>Compute an image and a preimage of a small set, and distinguish a preimage from an inverse function.</li>
<li>Use coordinates to analyze a function into a product.</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">def q (x : ℝ) : ℝ := x + 3

example : Injective q := by
  intro x1 x2 h
  dsimp only [q] at h
  linarith
</code></pre>
</div>
<div>
<p><strong>In Lean</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">After  intro x1 x2 h:
x1 x2 : ℝ
h : q x1 = q x2
⊢ x1 = x2

After  dsimp only [q] at h:
h : x1 + 3 = x2 + 3
⊢ x1 = x2
</code></pre>
<p class="small"><code>⊢</code> marks the current goal; the lines above it are what you may use.</p>
<p><code>linarith</code> does the cancellation.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">def s (a : ℚ) : ℚ := 3 * a + 2

example : Surjective s := by
  intro y
  use (y - 2) / 3
  dsimp only [s]
  ring
</code></pre>

<p><strong>In Lean</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">After  intro y:
⊢ ∃ x, s x = y

After  use (y - 2) / 3:
⊢ s ((y - 2) / 3) = y

After  dsimp only [s]:
⊢ 3 * ((y - 2) / 3) + 2 = y
</code></pre>

<h2 id="apply-the-surjectivity-hypothesis-to-one-target">Apply the surjectivity hypothesis to one target</h2>
<div class="cols">
<div>
<p><strong>Over ℝ: supply the witness</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example :
    Surjective (fun x : ℝ ↦ 2 * x) := by
  intro y
  use y / 2
  dsimp only
  ring
</code></pre>
</div>
<div>
<p><strong>Over ℤ: ask the hypothesis for one</strong></p>
<p class="small">Proof fragment — <code>h</code>, surjectivity over ℤ, is assumed.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">obtain ⟨x, hx⟩ := h 1
dsimp only at hx
omega
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">x : ℤ
hx : 2 * x = 1
⊢ False
</code></pre>
<p><code>omega</code> knows an even integer is not <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.507ex" role="img" focusable="false" viewBox="0 -666 500 666"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container>.</p>
</div>
</div>
<p class="small">Proof reminder. Injective: start with equal outputs. Surjective: fix a target, give a witness. Disprove: a collision or a missed output.</p>

</section>

<p class="small">Membership rules in Lean — not the proof goals. Here <code>fun x : ℝ ↦ x ^ 2</code> is σ. The full set equality proofs are on <a href="../Modules/07-functions/Lean/Module%207%20-%20Images%20and%20preimages%20example.md"><em>Module 7 - Images and preimages example</em></a>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">y ∈ (fun x : ℝ ↦ x ^ 2) &#x27;&#x27; {0, 1}  ↔  ∃ x, (x = 0 ∨ x = 1) ∧ x ^ 2 = y
x ∈ (fun x : ℝ ↦ x ^ 2) ⁻¹&#x27; {0, 1}  ↔  x ^ 2 = 0 ∨ x ^ 2 = 1
</code></pre>
<p><strong>A preimage is a set of inputs; it exists even without an inverse function.</strong></p>
<p class="small">Proof reminder. For image membership, give a witness from the input set. For preimage membership, test where the given input lands.</p>

<p><strong>Which coordinate is enough?</strong></p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">def v (m : ℤ) : ℤ × ℤ := (m + 1, 2 - m)

example : Injective v := by
  intro m n h
  have h1 : (v m).1 = (v n).1 :=
    congrArg Prod.fst h
  dsimp only [v] at h1
  linarith
</code></pre>
<p><code>congrArg Prod.fst h</code> applies the first projection to both sides of <code>h</code>.</p>

<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : ¬ Surjective v := by
  intro h
  obtain ⟨m, hm⟩ := h (0, 1)
  have h1 : (v m).1 = 0 :=
    congrArg Prod.fst hm
  have h2 : (v m).2 = 1 :=
    congrArg Prod.snd hm
  dsimp only [v] at h1 h2
  omega
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">After  obtain:
m : ℤ
hm : v m = (0, 1)

After  dsimp only [v] at h1 h2:
h1 : m + 1 = 0
h2 : 2 - m = 1
⊢ False
</code></pre>
<p><code>omega</code> finds the integer contradiction.</p>
</div>
</div>
<p class="small">Proof reminder. Project to the coordinates you need. One can suffice for injectivity, and every witness must satisfy both.</p>

<h2 id="recap-choose-the-first-proof-move">Recap: choose the first proof move</h2>
<div class="compact">
<table>
<thead>
<tr>
<th>Claim</th>
<th>First move</th>
</tr>
</thead>
<tbody>
<tr>
<td>Injective</td>
<td>Assume equal outputs and recover equality of inputs.</td>
</tr>
<tr>
<td>Surjective</td>
<td>Fix a target and give a witness in the domain.</td>
</tr>
<tr>
<td>A property fails</td>
<td>Give a collision or a missed output.</td>
</tr>
<tr>
<td>Two functions are equal</td>
<td>Fix an arbitrary input with <code>ext</code>.</td>
</tr>
<tr>
<td>Two functions are inverses</td>
<td>Check both compositions on their respective domains.</td>
</tr>
<tr>
<td>Image or preimage membership</td>
<td>Find an input witness, or test where the given input lands.</td>
</tr>
<tr>
<td>Equality of output pairs</td>
<td>Project to the coordinate equations you need.</td>
</tr>
</tbody>
</table>
</div>
<p><strong>Read the arrow, then decide what to produce.</strong></p>
