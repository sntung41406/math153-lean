<h2 id="learning-goals">Learning goals</h2>
<p><strong>How can finitely many lines prove a claim about every natural number?</strong></p>
<p>By the end of the lecture, you can:</p>
<ul>
<li>Write the predicate, base case, hypothesis, and target before starting a proof.</li>
<li>Prove a formula for a recursive sequence and identify the matching Lean steps.</li>
<li>Choose and check a starting point, including a &quot;sufficiently large&quot; threshold.</li>
<li>Explain when a step needs two neighbours, a stronger claim, or all smaller cases.</li>
<li>Describe descent as strong induction on a decreasing measure.</li>
</ul>
<p class="small">Main move: <code>induction</code>. Variations: <code>Nat.le_induction</code>, <code>Nat.strong_induction_on</code>. The arithmetic and logic tools are recall from earlier modules.</p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>

<h2 id="induction-creates-the-two-obligations"><code>induction</code> creates the two obligations</h2>
<div class="cols">
<div>
<p class="small">Proof skeleton — branch proofs omitted.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">induction n with
| zero =&gt; ...
| succ k IH =&gt; ...
</code></pre>
<p><code>succ</code> names the successor case. <code>k</code> is arbitrary. <code>IH</code> names the proof of the previous case.</p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Base:
⊢ 2 ^ 0 ≥ 0 + 1

Step:
k : ℕ
IH : 2 ^ k ≥ k + 1
⊢ 2 ^ (k + 1) ≥ k + 1 + 1
</code></pre>
<p class="small"><code>⊢</code> marks what remains to prove; the facts above it are hypotheses you may use.</p>
</div>
</div>
<p>These are the same obligations as on paper.</p>
<p><strong>Induction changes the available assumptions, not just the expression in the goal.</strong></p>
<footer>MATH 153 — Introduction to Mathematics (F26)</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="MATH 153 — Introduction to Mathematics (F26)" data-theme="default" lang="C" data-marpit-pagination="6" style="--paginate:true;--footer:MATH 153 — Introduction to Mathematics (F26);--theme:default;" data-marpit-pagination-total="27" data-size="16:9">
<h2 id="the-paper-chain-becomes-a-lean-chain">The paper chain becomes a Lean chain</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example (n : ℕ) : 2 ^ n ≥ n + 1 := by
  induction n with
  | zero =&gt; norm_num
  | succ k IH =&gt;
    calc 2 ^ (k + 1) = 2 * 2 ^ k := by ring
      _ ≥ 2 * (k + 1) := by gcongr
      _ = (k + 1 + 1) + k := by ring
      _ ≥ k + 1 + 1 := by omega
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">def x : ℕ → ℤ
  | 0 =&gt; 5
  | n + 1 =&gt; 2 * x n - 1
</code></pre>
<p><code>ℕ → ℤ</code>: natural-number indices, integer values.</p>
<p>The two cases are the initial value and the recursive rule.</p>

<h2 id="natle_induction-keeps-the-lower-bound-in-view"><code>Nat.le_induction</code> keeps the lower bound in view</h2>
<p class="small">Proof skeleton — step calculation omitted.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : ∃ N : ℕ, ∀ n ≥ N, 2 ^ n ≥ n ^ 2 := by
  use 4
  intro n hn
  induction n, hn using Nat.le_induction with
  | base =&gt; norm_num
  | succ k hk IH =&gt; ...
</code></pre>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">hk : 4 ≤ k
IH : 2 ^ k ≥ k ^ 2
⊢ 2 ^ (k + 1) ≥ (k + 1) ^ 2
</code></pre>
</div>
<div>
<p><code>use 4</code> chooses the witness. <code>Nat.le_induction</code> starts there and adds <code>hk</code>.</p>
</div>
</div>

<h2 id="lean-follows-the-same-pair-structure">Lean follows the same pair structure</h2>
<p class="small">Step fragment — <code>a</code>, the paired claim, and the induction setup are on the linked page.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">obtain ⟨IH1, IH2⟩ := IH
constructor
· exact IH2
· calc a (k + 1 + 1) = a (k + 1) + 2 * a k := by rw [a]
    _ = 2 ^ (k + 1 + 1) + (-1) ^ (k + 1 + 1) := by
      rw [IH1, IH2]
      ring
</code></pre>
<p><code>obtain</code> unpacks the old pair. <code>constructor</code> builds the new one. The first goal reuses <code>IH2</code>; the second uses both formulas.</p>
<p class="small">Recursive-theorem form: <a href="../Modules/06-induction/Lean/Module%206%20-%20Two-step%20recurrence%20closed%20form%20example.md"><em>Module 6 - Two-step recurrence closed form example</em></a>. Fibonacci bound: <a href="../Modules/06-induction/Lean/Module%206%20-%20Two-step%20induction%20example.md"><em>Module 6 - Two-step induction example</em></a>.</p>

<h2 id="to-use-strong-ih-justify-the-smaller-input">To use strong <code>IH</code>, justify the smaller input</h2>
<div class="compact">
<p>Setup: <code>induction n using Nat.strong_induction_on</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">IH : ∀ m &lt; n, 2 ≤ m → ∃ p, p.Prime ∧ p ∣ m
</code></pre>
<p>In the nonprime branch, <code>Nat.exists_dvd_of_not_prime2</code> supplies <code>m</code>, <code>hmdvd : m ∣ n</code>, <code>hm2 : 2 ≤ m</code>, and <code>hmn : m &lt; n</code>.</p>
<p class="small">Proof fragment — nonprime branch, with a proper divisor already supplied.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">obtain ⟨p, hp_prime, hp_dvd⟩ := IH m hmn hm2
exact ⟨p, hp_prime, dvd_trans hp_dvd hmdvd⟩
</code></pre>
<p><code>IH m hmn hm2</code>: the smaller number; proof it is smaller; proof it meets the lower bound.</p>
<p><strong>Strong induction still requires a strict decrease at every use.</strong></p>
<p class="small">Full proof: <a href="../Modules/06-induction/Lean/Module%206%20-%20Strong%20induction%20example.md"><em>Module 6 - Strong induction example</em></a>.</p>
</div>
