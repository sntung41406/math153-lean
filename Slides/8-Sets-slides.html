<h2 id="read-the-membership-claim-first">Read the membership claim first</h2>
<p>By the end of the lecture, you can:</p>
<ul>
<li>Read set-builder notation and decide whether a given object belongs to a set.</li>
<li>Prove a subset claim or give a counterexample, and use <code>ext</code> to start a set equality proof.</li>
<li>Translate membership in set operations, images, and preimages into logical statements.</li>
<li>Read power-set membership as inclusion, and use injections, bijections, and Cantor's theorem to compare sizes.</li>
</ul>
<p><strong>Before any set proof, pick an arbitrary element and turn its membership into a logical statement.</strong></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example :
    {a : ℕ | 4 ∣ a} ⊆ {b : ℕ | 2 ∣ b} := by
  intro a ha
  obtain ⟨k, hk⟩ := ha
  use 2 * k
  rw [hk]
  ring
</code></pre>

<p><strong>In Lean</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">After  intro a ha:
ha : a ∈ {a | 4 ∣ a}      -- means 4 ∣ a
⊢ a ∈ {b | 2 ∣ b}         -- means 2 ∣ a

After  obtain ⟨k, hk⟩ := ha:
hk : a = 4 * k

After  use 2 * k:
⊢ a = 2 * (2 * k)
</code></pre>

<h2 id="from-set-equality-to-a-lean-goal-about-logic">From set equality to a Lean goal about logic</h2>
<p class="small">Opening lines only — the full proof is on the linked page.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {α : Type*} (A B C : Set α) :
    A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C) := by
  ext x
  simp only [Set.mem_inter_iff, Set.mem_union]
</code></pre>
<div class="cols compact">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">After  simp only:
⊢ x ∈ A ∧ (x ∈ B ∨ x ∈ C) ↔
    x ∈ A ∧ x ∈ B ∨ x ∈ A ∧ x ∈ C
</code></pre>
<p><code>simp only</code> rewrites with exactly the membership rules listed.</p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">First forward case:
hA : x ∈ A
hB : x ∈ B
⊢ x ∈ A ∧ x ∈ B ∨ x ∈ A ∧ x ∈ C
      ↓  left
⊢ x ∈ A ∧ x ∈ B
</code></pre>
<p><code>left</code> chooses the left side of an &quot;or&quot;.</p>
</div>
</div>
<p class="small">Full proof: <a href="../Modules/08-sets/Lean/Module%208%20-%20Distributive%20law%20example.md"><em>Distributive law</em></a>. The other rules: <a href="../Modules/08-sets/Lean/Module%208%20-%20Bounded%20intersection%20example.md"><em>Bounded intersection</em></a> · <a href="../Modules/08-sets/Lean/Module%208%20-%20Union%20example.md"><em>Union</em></a> · <a href="../Modules/08-sets/Lean/Module%208%20-%20Complement%20example.md"><em>Complement</em></a>.</p>

</section>

<p>In Lean the product of two sets is <code>A ×ˢ B</code>. The pair has type <code>ℕ × ℤ</code>.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example : ((3 : ℕ), (-2 : ℤ)) ∈
    {n : ℕ | Odd n} ×ˢ {z : ℤ | z &lt; 0} := by
  rw [Set.mem_prod]
  constructor
  · show Odd 3
    use 1
    norm_num
  · show (-2 : ℤ) &lt; 0
    norm_num
</code></pre>
<p><code>rw [Set.mem_prod]</code> splits membership into one claim for each coordinate.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example {α β : Type*} (f : α → β)
    (S T : Set β) :
    f ⁻¹' (S ∪ T) = f ⁻¹' S ∪ f ⁻¹' T := by
  ext x
  simp only [Set.mem_preimage, Set.mem_union]
</code></pre>
<p>Both sides become <code>f x ∈ S ∨ f x ∈ T</code>.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-lean">example :
    ({0} : Set ℕ) ∈ 𝒫 ({0, 1} : Set ℕ) := by
  rw [Set.mem_powerset_iff]
  intro x hx
  simp only [Set.mem_singleton_iff] at hx
  simp [hx]
</code></pre>
<p><code>𝒫</code> is Lean's power set.</p>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">⊢ {0} ∈ 𝒫 {0, 1}
      ↓  rw [Set.mem_powerset_iff]
⊢ {0} ⊆ {0, 1}
      ↓  intro x hx
hx : x ∈ {0}
⊢ x ∈ {0, 1}
</code></pre>
<p><strong>What does <code>intro x hx</code> introduce?</strong></p>
</div>
</div>
<p class="small">Proof reminder. Power-set membership: rewrite it as inclusion, then introduce an element. Practice: <a href="../Modules/08-sets/Lean/Module%208%20-%20Power%20set%20example.md"><em>Power set</em></a> · <a href="../Modules/08-sets/Lean/Module%208%20-%20Power%20set%20inclusion%20example.md"><em>Power set inclusion</em></a>, for 𝒫(A) ∪ 𝒫(B).</p>
